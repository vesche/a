name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev

      - name: Verify vendored checksums
        run: ./scripts/vendor_check.sh

      - name: Build native CLI
        run: ./build.sh

      - name: Smoke test
        run: ./a run examples/hello.a

      - name: Verify bootstrap/cli.c is up to date
        run: |
          ./a cc src/cli.a -o /tmp/bootstrap_verify.c
          if ! diff -q bootstrap/cli.c /tmp/bootstrap_verify.c > /dev/null 2>&1; then
            echo "ERROR: bootstrap/cli.c is out of date."
            echo "Regenerate with:"
            echo "  ./a cc src/cli.a -o bootstrap/cli.c"
            diff bootstrap/cli.c /tmp/bootstrap_verify.c | head -20
            exit 1
          fi
          echo "bootstrap/cli.c is up to date."

      # Generated files must match their sources: the checker's arity table
      # comes from the C runtime prototypes, STATUS.md from the compiler's
      # builtin table cross-checked against REFERENCE.md and the tests.
      - name: Verify generated files are up to date
        run: |
          ./a run scripts/gen_builtin_arity.a > /tmp/arity.a
          diff -u std/compiler/builtin_arity.a /tmp/arity.a || { echo "std/compiler/builtin_arity.a is stale: ./a run scripts/gen_builtin_arity.a > std/compiler/builtin_arity.a"; exit 1; }
          ./a run scripts/status.a > /tmp/STATUS.md
          diff -u STATUS.md /tmp/STATUS.md || { echo "STATUS.md is stale: ./a run scripts/status.a > STATUS.md"; exit 1; }
          ./a doc --check

      # The static checker must be clean on everything we ship.
      - name: Static check (a check)
        run: ./a check src std scripts tests/native examples

      # The same runner developers use. Every test binary runs in its own
      # process group with a deadline, so a hanging test is a TIMEOUT line,
      # not a stuck job. Nothing is skipped: the tests previously excluded
      # here for "hanging" were a fork bomb (test_selfopt) and fixtures that
      # leaked servers; both are fixed.
      - name: Native test suite
        run: ./a test tests/native/ --timeout 90

      # Memory correctness: runtime, compiler, and every test under
      # AddressSanitizer. Any report fails the build.
      - name: Memory check (AddressSanitizer)
        if: runner.os == 'Linux'
        run: bash scripts/asan.sh
